<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EQUILIBRIUM | Регистрация владельца</title>
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>

<body>

    <header class="navbar">
        <div class="nav-container">
            <a href="../index.html" class="logo">EQUILIBRIUM</a>
            <nav class="nav-menu">
                <a href="../index.html" class="nav-link">Каталог</a>
                <a href="login.html" class="nav-link">Панель владельца</a>
            </nav>
            <div class="user-badge"><span style="color: #8E8E93;">Регистрация</span></div>
        </div>
    </header>

    <main class="main-content">
        <div class="auth-wrapper card-premium">
            <h3 style="margin-bottom: 25px; font-weight: 500; text-align: center; letter-spacing: 1px;">СОЗДАТЬ АККАУНТ
            </h3>

            <form action="login.html" method="POST">
                <div class="form-group">
                    <label class="form-label">Полное Имя</label>
                    <input type="text" class="form-input" required placeholder="Иван Иванов">
                </div>
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-input" required placeholder="owner@equilibrium.ru">
                </div>
                <div class="form-group">
                    <label class="form-label">Новый пароль</label>
                    <input type="password" class="form-input" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn-gold">Зарегистрироваться</button>
            </form>

            <div style="margin-top: 20px; text-align: center; font-size: 13px;">
                <span style="color: var(--text-secondary);">Уже зарегистрированы?</span>
                <a href="login.html"
                    style="color: var(--accent-gold); text-decoration: none; margin-left: 5px;">Войти</a>
            </div>
        </div>
    </main>

</body>

</html>
